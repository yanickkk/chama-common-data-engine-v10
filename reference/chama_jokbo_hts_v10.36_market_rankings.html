        const eok = (price * shares) / 100000000;
        return `${eok >= 100 ? Math.round(eok).toLocaleString('ko-KR') : eok.toFixed(1)}억`;

      // Cloudflare Worker를 통해 Naver/NXT/Yahoo 시세를 수집합니다.

      const MARKET_PROXY_URL = (window.CHAMA_MARKET_PROXY_URL || marketProxyUrl || '').trim().replace(/\/$/, '');

      const fetchProxyQuotes = async (stocks, includeHistory=true) => {

          throw new Error('Cloudflare Worker 주소가 설정되지 않았습니다. ⚙️ Worker 연결 설정에서 /api/market 주소를 입력하세요.');
        }
        const codes = Array.from(new Set(stocks.map(s => s.code || TICKERS[s.name]?.code).filter(Boolean)));
        if (!codes.length) return stocks.map(()=>null);
        const root = MARKET_PROXY_URL.endsWith('/api/market') ? MARKET_PROXY_URL.replace('/api/market','') : MARKET_PROXY_URL;
        const endpoint = includeHistory ? 'analysis' : 'market';
        const byCode = {};
        // Free Worker의 외부 subrequest 및 D1 조회량을 제한하기 위해 15종목씩 나눕니다.
        for(let i=0;i<codes.length;i+=15){
          const batch=codes.slice(i,i+15);
          const url=`${root}/api/${endpoint}?codes=${encodeURIComponent(batch.join(','))}`;
          const response=await fetch(url,{cache:'no-store',mode:'cors',headers:{'Accept':'application/json'}});
          if(!response.ok)throw new Error(`${endpoint} Worker HTTP ${response.status}`);
          const payload=await response.json();
          if(!payload?.ok||!Array.isArray(payload.quotes))throw new Error(payload?.error||'Market Worker 응답 형식 오류');
          payload.quotes.forEach(q=>{if(q?.code)byCode[q.code]=q;});
        }
        return stocks.map(stock=>{
          const code=stock.code||TICKERS[stock.name]?.code;
          return byCode[code]?{...byCode[code],source:byCode[code].source||(includeHistory?'D1-CACHE':'NAVER')}:null;
        });
      };

      const fetchQuote = async (stock) => {

      // 대표 대형주 시세는 기존 Worker의 /api/analysis 경로로 조회합니다.

        } catch (e) {

          const isHigh = typeof highFlag === 'boolean' ? highFlag : (high52 > 0 && current > 0 ? current >= high52 * 0.999 : null);
          const capPass = marketCap === null ? null : marketCap >= 2e11;
          const valueThreshold = (() => { const now = new Date(); return now.getHours() > 14 || (now.getHours() === 14 && now.getMinutes() >= 30) ? 5e10 : 1e11; })();
          const valuePass = tradeValue === null ? null : tradeValue >= valueThreshold;

          const pctThreshold = marketCap !== null && marketCap < 5e12 ? 10 : 5;
          const pctPass = pct === null ? null : pct >= pctThreshold;
          const flags = [capPass, valuePass, gapPass, pctPass, isHigh];
          const passed = flags.filter(v => v === true).length;
          const pending = flags.filter(v => v === null).length;

        });

                      {card.stocks.filter(stock => !watchOnlyFavorites || favorites.includes(stock.id)).map((stock) => {
                        const isFav = favorites.includes(stock.id);

                                  <span className="text-blue-400 font-semibold text-[10px]">{ind.val}</span>
                                </div>
                              ))}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>

            )}
          </main>
          </>}



          {showStockAnalysis && <div className="fixed inset-0 z-[100] bg-black/75 backdrop-blur-sm overflow-y-auto p-3 sm:p-6" onClick={()=>setShowStockAnalysis(false)}><section onClick={e=>e.stopPropagation()} className="relative max-w-[1200px] mx-auto my-4 rounded-xl border border-gray-700 bg-[#11141c] px-4 py-5 space-y-4 shadow-2xl"><div className="flex items-center justify-between gap-3"><div className="text-lg font-bold">종목 상세분석</div><button onClick={()=>setShowStockAnalysis(false)} className="rounded-lg border border-gray-700 px-3 py-1.5 text-sm hover:bg-white/10">닫기 ✕</button></div>

              <div className="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs"><div className="bg-black/20 rounded p-3"><div className="text-gray-500">거래대금</div><b>{selectedQuote ? formatVolume(selectedQuote.price,selectedQuote.volume) : selectedStock.volume}</b></div><div className="bg-black/20 rounded p-3"><div className="text-gray-500">등급</div><b>{selectedAnalysis?.grade || '분석 대기'}</b></div><div className="bg-black/20 rounded p-3"><div className="text-gray-500">점수</div><b>{selectedAnalysis?.score ?? '—'}</b></div><div className="bg-black/20 rounded p-3"><div className="text-gray-500">기법</div><b>{selectedAnalysis?.chama?'차마존':selectedAnalysis?.cm?'CM':selectedStock.technique}</b></div></div>
              <div><h3 className="font-bold text-sm mb-2">이동평균선 근접 현황</h3><div className="grid grid-cols-1 sm:grid-cols-2 gap-2">{(selectedQuote?.indicators || calculateIndicators(selectedStock, selectedQuote || {changePct:parseFloat(selectedStock.change)||0})).map((ind,i)=><div key={i} className="bg-black/20 rounded p-3 flex justify-between text-xs"><span>{ind.label}</span><b className="text-sky-300">{ind.val}</b></div>)}</div></div>
              {selectedAnalysis && <div className="text-xs text-gray-400">RSI {Number(selectedAnalysis.rsi||0).toFixed(1)} · 거래량 비율 {Number(selectedAnalysis.volRatio||0).toFixed(2)}배 · 차마존 {selectedAnalysis.chamaCount||0}/5 · CM {selectedAnalysis.cmCount||0}/5</div>}
              <button onClick={()=>{setJournalForm(f=>({...f,name:selectedStock.name,code:selectedStock.code || TICKERS[selectedStock.name]?.code||''}));setShowJournalForm(true);setActiveTab('매매복기');}} className="bg-purple-700 hover:bg-purple-600 rounded-lg px-4 py-2 text-xs font-bold">이 종목 매매복기 작성</button>

          {activeTab === '조건검색' && <section className="max-w-[1400px] mx-auto px-4 py-5 space-y-4"><div><h2 className="text-xl font-bold">조건검색</h2><p className="text-xs text-gray-500 mt-1">현재 등록 종목 + 전체시장 스크리너가 반환한 차마존·CM 후보를 대상으로 검색합니다. 전체 시장 원시 종목을 직접 필터링하는 기능은 종목목록 API 보완 후 확장합니다.</p></div>

          </section>}

          {activeTab === '매매복기' && <section className="max-w-[1200px] mx-auto px-4 py-5 space-y-4"><div className="flex flex-wrap justify-between items-center gap-2"><div><h2 className="text-xl font-bold">매매복기</h2><p className="text-xs text-gray-500 mt-1">기록은 이 브라우저의 localStorage에 저장됩니다. 다른 기기와 자동 동기화되지 않습니다.</p></div><button onClick={()=>setShowJournalForm(!showJournalForm)} className="bg-purple-700 rounded-lg px-4 py-2 text-xs font-bold">+ 매매 기록 추가</button></div>
            {showJournalForm&&<div className="bg-[#1a1c23] border border-gray-800 rounded-xl p-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 text-xs"><label>거래일<input type="date" value={journalForm.date} onChange={e=>setJournalForm(f=>({...f,date:e.target.value}))} className="block w-full mt-1 bg-black/30 border border-gray-700 rounded p-2" /></label><label>종목명<input value={journalForm.name} onChange={e=>setJournalForm(f=>({...f,name:e.target.value}))} placeholder="종목명" className="block w-full mt-1 bg-black/30 border border-gray-700 rounded p-2" /></label><label>종목코드<input value={journalForm.code} onChange={e=>setJournalForm(f=>({...f,code:e.target.value}))} placeholder="종목코드" className="block w-full mt-1 bg-black/30 border border-gray-700 rounded p-2" /></label><label>구분<select value={journalForm.side} onChange={e=>setJournalForm(f=>({...f,side:e.target.value}))} className="block w-full mt-1 bg-black/30 border border-gray-700 rounded p-2"><option>매수</option><option>매도</option></select></label><label>가격<input type="number" value={journalForm.price} onChange={e=>setJournalForm(f=>({...f,price:e.target.value}))} className="block w-full mt-1 bg-black/30 border border-gray-700 rounded p-2" /></label><label>수량<input type="number" value={journalForm.quantity} onChange={e=>setJournalForm(f=>({...f,quantity:e.target.value}))} className="block w-full mt-1 bg-black/30 border border-gray-700 rounded p-2" /></label><label className="sm:col-span-2 md:col-span-3">매매 이유 / 복기 메모<textarea value={journalForm.memo} onChange={e=>setJournalForm(f=>({...f,memo:e.target.value}))} rows="3" className="block w-full mt-1 bg-black/30 border border-gray-700 rounded p-2" placeholder="진입 근거, 매도 이유, 잘한 점과 개선할 점" /></label><div className="sm:col-span-2 md:col-span-3 flex gap-2"><button onClick={addJournalEntry} className="bg-emerald-700 rounded px-4 py-2 font-bold">기록 저장</button><button onClick={()=>setShowJournalForm(false)} className="bg-gray-700 rounded px-4 py-2">취소</button></div></div>}
            <div className="bg-[#1a1c23] border border-gray-800 rounded-xl overflow-hidden">{journal.length?journal.map(item=><div key={item.id} className="p-3 border-b border-gray-800 flex flex-wrap items-start gap-3 text-xs"><div className="min-w-24"><b>{item.name}</b><div className="text-gray-500">{item.date} · {item.side}</div></div><div>{Number(item.price).toLocaleString()}원 × {Number(item.quantity).toLocaleString()}주</div><div className="flex-1 text-gray-400 whitespace-pre-wrap">{item.memo||'메모 없음'}</div><button onClick={()=>saveJournal(journal.filter(x=>x.id!==item.id))} className="text-red-400">삭제</button></div>):<div className="p-10 text-center text-gray-500 text-sm">아직 기록이 없습니다. 첫 매매 기록을 추가해 보세요.</div>}</div>

          {activeTab === '활용법' && <section className="max-w-4xl mx-auto px-4 py-8 space-y-3"><h2 className="text-xl font-bold">차마 족보 활용법</h2><p className="text-sm text-gray-400">주도주 화면에서 S급/A급 후보와 차마존·CM 조건을 확인하고, 종목명을 선택해 상세분석으로 이동합니다.</p><p className="text-sm text-gray-400">조건검색은 현재 수집된 시세·분석 결과 범위에서 종목을 좁힙니다. 매매복기는 거래일, 종목, 가격, 수량, 진입·청산 이유를 브라우저에 기록합니다.</p><p className="text-sm text-amber-300">기술적 조건과 과거 데이터는 투자 판단을 돕는 참고 정보이며 수익을 보장하지 않습니다.</p></section>}
          {activeTab === '커뮤니티' && <section className="max-w-4xl mx-auto px-4 py-8"><h2 className="text-xl font-bold">커뮤니티</h2><p className="text-sm text-gray-500 mt-2">커뮤니티 게시판 연동은 아직 준비 중입니다.</p></section>}

          {showWorkerSetup && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-[100]">
              <div className={`max-w-lg w-full rounded-xl p-5 border shadow-2xl ${
                darkMode ? 'bg-[#1a1c23] border-purple-700 text-white' : 'bg-white border-gray-300 text-black'
              }`}>
                <div className="flex items-center justify-between mb-4">
                  <div>
                    <h3 className="font-bold text-base">☁️ Cloudflare Worker 연결</h3>
                    <p className="text-[11px] text-gray-400 mt-1">Naver → Yahoo 백업 시세를 가져올 Worker 주소를 입력하세요.</p>
                  </div>
                  {marketProxyUrl && (
                    <button onClick={() => setShowWorkerSetup(false)} className="text-gray-400 hover:text-white text-xs">✕</button>
                  )}
                </div>
                <label className="block text-xs font-semibold mb-2">Worker API 주소</label>
                <input
                  type="url"
                  value={workerInput}
                  onChange={e => setWorkerInput(e.target.value)}
                  placeholder="https://내-worker.workers.dev/api/market"
                  autoFocus
                  className={`w-full px-3 py-2 rounded-lg border text-sm outline-none focus:ring-2 focus:ring-purple-500 ${
                    darkMode ? 'bg-[#111318] border-gray-700 text-white' : 'bg-white border-gray-300 text-black'
                  }`}
                />
                <div className="mt-2 text-[10px] text-gray-500">예: https://chama-market-proxy.xxxxx.workers.dev/api/market</div>
                <div className="mt-3 p-3 rounded-lg bg-blue-950/30 border border-blue-900/50 text-[10px] text-blue-200 leading-5">
                  <b>확인 방법:</b> Worker 주소 뒤에 <code>/health</code>를 붙여 정상 응답을 확인하세요. HTML에는 <code>/api/market</code>까지 입력합니다.
                </div>
                <div className="flex gap-2 mt-5">
                  <button
                    onClick={() => {
                      const raw = workerInput.trim().replace(/\/$/, '');
                      if (!raw) return;
                      const normalized = raw.endsWith('/api/market') ? raw : `${raw}/api/market`;
                      setMarketProxyUrl(normalized);
                      try { localStorage.setItem('chama_market_proxy_url', normalized); } catch(e) {}
                      setShowWorkerSetup(false);
                      setDataError('');
                      setTimeout(() => refreshQuotes(), 0);
                    }}
                    className="flex-1 bg-purple-600 hover:bg-purple-500 text-white py-2 rounded-lg text-xs font-bold"
                  >연결 저장 및 시세 조회</button>
                  {marketProxyUrl && (
                    <button onClick={() => setShowWorkerSetup(false)} className="px-4 bg-gray-700 hover:bg-gray-600 text-white py-2 rounded-lg text-xs">취소</button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* 5. 알림 히스토리 모달 */}
          {showHistoryModal && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className={`max-w-md w-full rounded-xl p-5 border shadow-2xl ${
                darkMode ? 'bg-[#1a1c23] border-gray-700 text-white' : 'bg-white border-gray-300 text-black'
              }`}>
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-sm flex items-center gap-2">
                    🔔 실시간 알림 히스토리
                  </h3>
                  <button onClick={() => setShowHistoryModal(false)} className="text-gray-400 hover:text-white text-xs">✕</button>
                </div>
                <div className="space-y-2 max-h-60 overflow-y-auto text-xs">
                  {alertHistory.length === 0 ? (
                    <div className="p-4 text-center text-gray-500">아직 발생한 알림이 없습니다.</div>
                  ) : alertHistory.map(a => (
                    <div key={a.id} className="p-2 bg-gray-800/50 rounded border border-gray-700 flex justify-between gap-2">
                      <div><span className="text-amber-400 font-bold">[{a.type}]</span> {a.stock} · {a.level}</div>
                      <span className="text-gray-500 text-[10px]">{a.time.toLocaleTimeString('ko-KR')}</span>
                    </div>
                  ))}
                </div>
                <button onClick={() => setShowHistoryModal(false)} className="w-full mt-4 bg-purple-600 text-white py-1.5 rounded text-xs font-bold">닫기</button>
              </div>
            </div>
          )}

          {/* 6. 검색조건 설정 모달 */}
          {showScreenerSettings && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 overflow-y-auto">
              <div className={`max-w-3xl w-full rounded-xl p-5 border shadow-2xl my-6 ${darkMode ? 'bg-[#1a1c23] border-gray-700 text-white' : 'bg-white border-gray-300 text-black'}`}>
                <div className="flex justify-between items-center mb-4"><div><h3 className="font-bold text-base">⚙️ 차마존 / CM 검색 옵션</h3><div className="text-[10px] text-gray-500 mt-1">모든 필터 기준값을 변경할 수 있습니다. 저장 후 전체 스캔을 실행하세요.</div></div><button onClick={()=>setShowScreenerSettings(false)} className="text-gray-400">✕</button></div>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-2 text-[11px]">
                  {[['market','시장','ALL'],['liquidityTop','실시간/차마존 대상 상위 종목 수',200],['calendarDays','달력 조회일수',120],['cmTop100','CM 상승률 Top N',100],['cmTradeValueKRW','CM 최소 거래대금(원)',100000000000],['cmDay0HighRisePct','CM 0일차 고가 상승률(%)',17],['cmTargetRisePct','CM 누적 목표 상승률(%)',50],['cmWindowDays','CM 목표 달성 거래일',5],['cmAchievementCandlePct','CM 달성일 종가 상승률(%)',10],['cmBreakoutLookback','CM 달성일 전고점 조회일',20]].map(([k,label,val])=><label key={k} className="p-2 rounded bg-gray-800/40"><span className="block text-gray-400 mb-1">{label}</span><input className="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1" value={screenerConfig[k] ?? val} onChange={e=>setScreenerConfig(c=>({...c,[k]:k==='market'?e.target.value:Number(e.target.value)}))}/></label>)}
                </div>
                <div className="mt-4 p-3 rounded border border-purple-900/60 bg-purple-950/20"><div className="font-bold text-xs mb-2">🔥 차마존 조건</div><div className="grid grid-cols-2 md:grid-cols-4 gap-2 text-[11px]">{[['maProximityPct','EMA 근접 ±%',3],['baseLineProximityPct','기준선 근접 ±%',3],['roundFigureProximityPct','라운드피겨 근접 ±%',2],['referenceLookbackDays','기준봉 최근일수',20],['limitUpPct','상한가 기준 상승률%',29.5],['masterHighLookback','마스터봉 신고가 기간',400],['masterCloseLookback','마스터봉 최고종가 기간',250],['masterRisePct','마스터봉 상승률%',10],['masterTradeValueKRW','마스터봉 거래대금(원)',100000000000],['resistanceLookbackDays','저지바 조회일수',60],['referenceProximityPct','기준봉중심 근접 ±%',3],['resistanceProximityPct','저지바 근접 ±%',3],['safetyBeltPct','EMA20 안전벨트 하단 %',10],['bollingerPeriod','EMA 볼린저 기간',20],['bollingerSigma','볼린저 σ',2],['bollingerPrevAbovePct','볼린저 전일 위쪽 %',3],['smartMoneyWeeks','스마트머니 신고가周数',78],['smartMoneyRecentDays','스마트머니 최근일수',20]].map(([k,label,val])=><label key={k} className="p-2 rounded bg-gray-900/50"><span className="block text-gray-400 mb-1">{label}</span><input type="number" step="any" className="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1" value={screenerConfig.chama?.[k] ?? val} onChange={e=>setScreenerConfig(c=>({...c,chama:{...(c.chama||{}),[k]:Number(e.target.value)}}))}/></label>)}</div>
                  <label className="block mt-2 text-[11px]"><span className="text-gray-400">라운드피겨 가격대(쉼표 구분)</span><input className="w-full mt-1 bg-gray-900 border border-gray-700 rounded px-2 py-1" value={(screenerConfig.chama?.roundLevels||[]).join(',')} onChange={e=>setScreenerConfig(c=>({...c,chama:{...(c.chama||{}),roundLevels:e.target.value.split(',').map(v=>Number(v.trim())).filter(Boolean)}}))}/></label>
                </div>
                <div className="mt-4 text-[10px] text-gray-500 leading-5">※ 차마존은 <b>EMA 근접이 필수</b>이며 기준선·라운드피겨·기준봉중심·저지바·안전벨트 첫 근접·볼린저 하단 첫 근접 중 2개 이상을 추가 충족해야 성립합니다. 스마트머니는 주봉 보너스입니다. CM은 ETF/ETN/스팩/SPAC을 처음부터 제외하고 당일 거래대금 기준 Top N을 만든 뒤 0일차→5거래일 내 50%→달성일 +10% 양봉+20일 전고점 돌파 순으로 판정합니다.</div>
                <div className="flex gap-2 mt-4"><button onClick={()=>{localStorage.setItem('chama_screener_config',JSON.stringify(screenerConfig));setShowScreenerSettings(false);setTimeout(refreshAutoCandidates,50);}} className="flex-1 bg-purple-600 hover:bg-purple-500 text-white py-2 rounded text-xs font-bold">저장하고 전체 스캔</button><button onClick={()=>{localStorage.removeItem('chama_screener_config');location.reload();}} className="px-4 bg-gray-800 rounded text-xs">기본값 복원</button></div>
              </div>
            </div>
          )}

          {/* 7. 알람 설정 모달 */}
          {showSettingsModal && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className={`max-w-md w-full rounded-xl p-5 border shadow-2xl ${
                darkMode ? 'bg-[#1a1c23] border-gray-700 text-white' : 'bg-white border-gray-300 text-black'
              }`}>
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-sm">⚙️ 알람 세부 설정</h3>
                  <button onClick={() => setShowSettingsModal(false)} className="text-gray-400 hover:text-white text-xs">✕</button>
                </div>
                <div className="space-y-2 text-xs">
                  <button onClick={()=>{setWorkerInput(marketProxyUrl); setShowSettingsModal(false); setShowWorkerSetup(true);}} className="w-full p-2 rounded bg-purple-900/30 border border-purple-700/50 text-purple-200 text-left">☁️ Cloudflare Worker 연결 주소 변경 (초기 팝업 없음)</button>
                  <label className="flex items-center justify-between p-2 bg-gray-800/40 rounded cursor-pointer">
                    <span>세력선/황금선 터치 시 웹 푸시 알림</span>
                    <input type="checkbox" checked={pushEnabled} onChange={enablePush} className="accent-purple-600" />
                  </label>
                  <label className="flex items-center justify-between p-2 bg-gray-800/40 rounded cursor-pointer">
                    <span>세력선/황금선 터치 시 소리 알림</span>
                    <input type="checkbox" checked={soundEnabled} onChange={e=>setSoundEnabled(e.target.checked)} className="accent-purple-600" />
                  </label>
                  <div className="p-2 rounded bg-blue-950/30 border border-blue-900/50 text-[10px] text-blue-200">
                    Cloudflare Worker → Naver 시세 우선 → 종목별 실패 시 Yahoo fallback. NXT 정보가 공개 응답에 포함될 경우 카드에 표시합니다.
                  </div>
                </div>
                <button onClick={() => setShowSettingsModal(false)} className="w-full mt-4 bg-emerald-600 text-white py-1.5 rounded text-xs font-bold">저장</button>
              </div>
            </div>
          )}

          <div className="max-w-[1600px] mx-auto px-4 pb-24 pt-3 text-[10px] text-gray-500">
            시세 데이터: Cloudflare Worker → Naver 우선 + 종목별 Yahoo fallback. NXT는 공개 응답에 포함되는 경우 표시되며 거래소 직접 체결 스트림이 아닙니다.
          </div>

          {/* 7. 하단 고정 탭 메뉴 */}
          <footer className={`fixed bottom-0 left-0 right-0 border-t px-2 py-2 flex items-center justify-start gap-5 overflow-x-auto scrollbar-none text-xs z-40 ${
            darkMode ? 'bg-[#1a1c23] border-gray-800 text-gray-400' : 'bg-white border-gray-300 text-gray-600'
          }`}>
            {[
              { name: '주도주', icon: 'fa-fire' },
              { name: '캘린더', icon: 'fa-calendar-days' },
              { name: '매매후보', icon: 'fa-trophy' },
              { name: '매매복기', icon: 'fa-book' },
              { name: '조건검색', icon: 'fa-filter' },
              { name: '활용법', icon: 'fa-book-open' },
              { name: '커뮤니티', icon: 'fa-comments' }
            ].map(tab => (
              <button key={tab.name} onClick={() => setActiveTab(tab.name)} className={`shrink-0 min-w-[58px] flex flex-col items-center gap-1 transition ${activeTab === tab.name ? 'text-purple-400 font-bold' : 'hover:text-gray-200'}`}>
                <i className={`fa-solid ${tab.icon} text-base`}></i>
                <span className="text-[10px] whitespace-nowrap">{tab.name}</span>
              </button>
            ))}
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
